#### Run parameters

seed = -1 # random seed (6 digits) or -1 for automatic generation
#macro = ./run.mac # input GEANT4 macro (empty for interactive mode)
output = out0 # name of the output root file WITHOUT .root extension (it will be added by the sim)

### these first 3 parameters can be overwritten by command line. Running
### g4matrix config.cfg -m runFile.mac -r 123456 -o outputName
### will effectively mean that for the progrma
### seed   = 123456
### macro  = runFile.mac
### output = outputName

#### materials etc
# crystal scintillator
crystal_material = 0     # 0 = lyso, 1 = bgo              - default = 0
crystal_dim_x = 50.0     # crystal dimension in x [mm]    - default = 50
crystal_dim_y = 50.0     # crystal dimension in y [mm]    - default = 50
crystal_dim_z = 6.0      # crystal dimension in z [mm]    - default = 6


# spreader
spreader_thickness        = 1.0 # thickness of spreader [mm]. if = 0, no volume added - default = 1.0
spreader_material         = 1     # 0 = air , 1 = fused silica           - default = 0
spreader_material_index   = 1.5

# gap simp to other
gap_to_sipm_thickness     = 0.1 # gap between sipm and adjacent volume (either spreader or crystal) [mm]. if = 0, no volume added - default = 0.1
gap_to_sipm_material      = 1     # 0 = air , 1 = fused silica           - default = 0
gap_to_sipm_refr_index    = 1.474

# crystal to other
gap_to_crystal_thickness  = 0.1 # gap between crystal and adjacent volume (either spreader or sipm) [mm]. if = 0, no volume added - default = 0.1
gap_to_cry_material       = 1     # 0 = air , 1 = fused silica           - default = 0
gap_to_crystal_refr_index = 1.474


# detectors
epoxy_refr_index           = 1.55

#layers
layers               = 1
gap_between_layers   = 2.0



# source
energy     = 511              # energy of gamma source in KeV
sourcex    = 0                # x position of the gamma source (center) in mm
sourcey    = 0                # y position of the gamma source (center) in mm
sourcez    = -20
direction_x = 0
direction_y = 0
direction_z = 1


depolished = 0                # 0 = polished, 1 = depolished
sigmaalpha       = 0.05       # 0 = no depolishing, but if depolished is fixed to 1, internal reflection will go according to next 3 parameters (not only specular)
specularlobe     = 1          # probability of reflection about the normal to the microfacet generated by the depolishing (specularlobe + specular + spikebackscattering < 1)
specularspike    = 0          # probability of reflection about the normal to the average surface (specularlobe + specular + spikebackscattering < 1)
backscattering   = 0          # probability of backscatter reflection (specularlobe + specular + spikebackscattering < 1)



### corner zones
# volumes with different depolishing to simulate the worse conditions of edges
corner_zone                = 0       # thickness of corner zone, in mm. if == 0, corners will not be included - default = 0
corner_cube_sigmaalpha     = 0.4     # sigma alpha of "cube" corner zones - default = 0.4
corner_pillar_sigmaalpha   = 0.35    # sigma alpha of front and back "pillar" corner zones - default = 0.35
corner_lateral_sigmaalpha  = 0.3     # sigma alpha of lateral "pillar" corner zones - default = 0.3




###############################



# esr
esr_thickness = 0.1
air_gap_cry_esr_thickness = 0.1
esr_type      = 0             # 0 =  standard esr simulated with real and imaginary refr. indexes, and transmittance (fixed or wavelength dependent)
                              # 1 = simplified esr, just reflectivity and transmittance
                              # default = 0

### standard esr
esrTransmittance = -1         # fixed transmittance of esr. Set to -1 if you want to use the values from measurements (that are wavelength dependent) - default = -1

### simplified esr
# specify transmittance and reflectivity for the specified specular reflector, if used.
# keep in mind that (simplified_esr_transmittance + simplified_esr_reflectivity) MUST be <= 1
# if it is < 1, what remains is absorbed
simplified_esr_transmittance  = 0.015 # fraction of optical photons trasmitted through simplified esr - default = 0.015
simplified_esr_reflectivity   = 0.985 # fraction of optical photons reflected by simplified esr - default = 0.985


# crystal features
# global features
lightyield       = 10      # light yield 1/MeV
resolutionScale  = 4.8          # parameter that broadens the energy resolution of crystal by making the numb of produced photons fluctuate by resolutionScale*sqrt(meanNumbOfPhotons)
slowrisetime         = 0.05       # LYSO slow component rise rise time in ns
slowdecaytime        = 40         # LYSO slow component rise decay time in ns


# detection features
quantumEff       = 1       # probability that a photon absorbed by the silicon detector gets actually detected

# physics
cuts = 0.025                  # production cut in g4, in mm - default = 0.025
