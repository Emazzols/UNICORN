#### Run parameters

#seed = 231559           # random seed (6 digits) or -1 for automatic generation
seed = -1
# macro = ./run.mac   # input GEANT4 macro (empty for interactive mode) -> graphical libraries has to be set correctly
output = ../results/prova2  # name of the output root file WITHOUT .root extension (it will be added by the sim)
ExtraInfoFile = 0 # 0 = no, 1 = yes. If 1, the result file will contain extra information for each step of the simulation.

#### world material
world_material = 0          # 0 = vacuum, 1 = air

#### Composition and geometry of the composite
structure = 0             # 0 = is a mixture of material, 1 = is made of a case containing well defined scintillating volumes. 
case_geometry = 0         # 0 = cube, 1 = sphere. Case is defined as the envelope of the luminescent volume. It is an external container comprising one or more composite if structure = 1. There can be one or more Cases inside another external container if multiple_scint = 1.
                          # WARNING! If multiple_scint = 0 && case_geometry = 1, do not trust the reflector, the optical coupling and the photodetector.

#### materials etc
# if the nanocomposite is a mixture or is made well defined scintillating volumes that are a mixture
host_fractMass = 99       # fraction of the host in the composite in % - default = 98
NP_fractMass = 1          # fraction of the nanoparticles in the composite in % - default = 2
# if well defined
case_material = 1        # 0 = Plastic, 1 = Fused Silica
composite_pos = 1        # 0 = lattice, 1 = random - WARNING! if case is spheric use random. Even if random, there is always a scintillating volume in the centre of the case
composite_num = 10          # number of scintillating volumes  - default = 1. WARNING! If composite_num = 1, it will take place in the centre of the case, regardless of composite_pos
                           # WARNING! In case of composite_num > 1, they will be all cubic, with side of composite_dim_x
# if composite_pos is lattice
composite_num_x = 2         # number of scintillating volumes in x direction - default = 1 - WARNING! composite_num must match the product of composite_num_x, composite_num_y and composite_num_z
composite_num_y = 2         # number of scintillating volumes in y direction - default = 1
composite_num_z = 2         # number of scintillating volumes in z direction - default = 1

#### for both mixtures and well defined nanocrystals
composite_material = 0      # scintillating volume material; 0 = lyso, 1 = CdSe/CdS in PMMA, 2 = BC422 - default = 0
composite_dim_x = 50      # scintillating volume dimension (diameter if structure = 0 and case_geometry = 1) in x [mm]    - default = 50
composite_dim_y = 50        # scintillating volume dimension in y [mm]    - default = 50
composite_dim_z = 50        # scintillating volume dimension in z [mm]    - default = 6
case_dim_x = 50             # case diameter/dimensions in x [mm]    - default = 50. WARNING! It must be set even if structure = 0. It must be equal to composite_dim_x if structure = 0, bigger if structure = 1
case_dim_y = 50             # case dimensions in y [mm]    - default = 50.  WARNING! It must be set even if structure = 0. It must be equal to composite_dim_y if structure = 0, bigger if structure = 1
case_dim_z = 50            # case dimensions in z [mm]    - default = 50.  WARNING! It must be set even if structure = 0. It must be equal to composite_dim_z if structure = 0, bigger if structure = 1
risetime = 0.005          # nanoparticle rise time in ns - default = 0.005
decaytime = 0.5           # nanoparticle decay time in ns - default = 0.5
lightyield = 1000         # nanoparticle light yield in photons/MeV - default = 1000
rayleigh_length = 1000000000      # Rayleigh scattering length in mm - default  = 10
mie_length = 1000000000    # Mie scattering length in mm - default  = 20
# if you want to replicate your structure in a bigger volume
multiple_scint = 0        # 0 = single structure, 1 = multiple structures each one containing NC
# if multiple_scint = 1
scint_num = 30             # number of structures - default = 1. WARNING! If multiple_scint = 1, the first structure will take place always in the centre of the case, the other will be placed randomly
sample_dim_x = 3000e-6         # dimension of the bigger volume in x [mm]
sample_material = 0         # 0 = Plastic, 1 = Fused Silica

# gap simp to other
opticalCoupling_thickness     = 0.1e-6   # gap between sipm and adjacent volume (composite) [mm]. if = 0, no volume added - default = 0.1
opticalCoupling_material      = 1     # 0 = air , 1 = grease           - default = 0
opticalCoupling_refr_index    = 1.474


# detector properties
number_of_detectors       = 1  # number of photodetectors surrounding the nanocomposite - default = 1, 2 or 6. WARNING! Use only with case_geometry = 0 
photoDetSize              = 50   # size of the photodetector box in mm - default = 50
pmtWindowThickness        = 1    # thickness of the photodetector in mm - default = 1
photoCathThickness        = 0.8    # thickness of the photodetector in mm - default = 1

propagateCerenkov         = 1  # Cherenkov photon propagation - default = 1
propagateScintillation    = 1  # scintillation photon propagation - default = 1

# source
particle   = 1                # 0 = gamma, 1 = electron, 2 = alpha, 3 = generic ion
Z = 11                        # Z of the generic ion if particle = 3
A = 22                        # A of the generic ion if particle = 3
full_chain = 0                # 0 = only the chosen ion, 1 = all the chain
source_from_file = 1                          # 0 = energy distribution from file, 1 = energy defined below - not valid if particle = 3
energy_file = PulseTube_20kV_20mA.txt          # file with energy distribution - WARNING! The file has to be located in the build directory
energy     = 100              # energy of source in keV if source_from_file = 1 - default = 1500
DBDrandomize = 1              # 1 will activate the randomization of double beta decay emission in the scintillator volume
# if DBDrandomize ON
position   = 2                # 0 = internal random (in a box of side source_dim), 1 = internal random (case), 2 = external bundle (in this case set sourcez)
source_dim = 0.1             # side of the box where the gamma source is randomly placed in mm if position = 0
#if DBDrandomize OFF
sourcex    = 0                # x position of the gamma source (center) in mm. ignored if DBDrandomize ON
sourcey    = 0                # y position of the gamma source (center) in mm. ignored if DBDrandomize ON
sourcez    = -100              # z position of the gamma source (center) in mm. ignored if DBDrandomize ON
direction_x = 0               # versor direction of the gamma source. ignored if DBDrandomize ON
direction_y = 0
direction_z = 1

# extra volume - important if you simulate 22Na, because you need a material for the positron to annihilate in
capsula = 0                      # 0 = no extra volume, 1 = extra volume
capsula_dim_x= 50                # extra volume dimension in x [mm]    - default = 5
capsula_dim_y= 50                # extra volume dimension in y [mm]    - default = 5
capsula_dim_z= 1                # extra volume dimension in z [mm]    - default = 5
capsulax    = 0                  # x position of the extra volume (center) in mm. 
capsulay    = 0                  # y position of the extra volume (center) in mm. 
capsulaz    = -30              # z position of the extra volume (center) in mm. 

#  surface state
# do not use for the moment
depolished = 0                # 0 = polished, 1 = depolished
sigmaalpha       = 0.05       # 0 = no depolishing, but if depolished is fixed to 1, internal reflection will go according to next 3 parameters (not only specular)
specularlobe     = 1          # probability of reflection about the normal to the microfacet generated by the depolishing (specularlobe + specular + spikebackscattering < 1)
specularspike    = 0          # probability of reflection about the normal to the average surface (specularlobe + specular + spikebackscattering < 1)
backscattering   = 0          # probability of backscatter reflection (specularlobe + specular + spikebackscattering < 1)


###############################



# esr
esr_type      = 1             # 0 =  standard esr simulated with real and imaginary refr. indexes, and transmittance (fixed or wavelength dependent)
                              # 1 = simplified esr, just reflectivity and transmittance
                              # default = 0
reflectorThickness = 1      # reflector thickness in mm, default = 0.1
airGapThickness = 0.1         # air gap thickness in mm between composite and reflector, default = 0.1

### standard esr
esrTransmittance = -1         # fixed transmittance of esr. Set to -1 if you want to use the values from measurements (that are wavelength dependent) - default = -1

### simplified esr
# specify transmittance and reflectivity for the specified specular reflector, if used.
# keep in mind that (simplified_esr_transmittance + simplified_esr_reflectivity) MUST be <= 1
# if it is < 1, what remains is absorbed
simplified_esr_transmittance  = 0.015 # fraction of optical photons transmitted through simplified esr - default = 0.015
simplified_esr_reflectivity   = 0.985 # fraction of optical photons reflected by simplified esr - default = 0.985
simplified_esr_efficiency     = 0.98 # ESR efficiency - default = 0.98

# composite features
# global features
resolutionScale  = 1           # parameter that broadens the energy resolution of composite by making the numb of produced photons fluctuate by resolutionScale*sqrt(meanNumbOfPhotons)
slowrisetime         = 0.05    # LYSO slow component rise rise time in ns
slowdecaytime        = 40      # LYSO slow component rise decay time in ns

# detection features
quantumEff       = 1           # probability that a photon absorbed by the silicon detector gets actually detected

# physics
cuts = 0.025                   # production cut in g4, in mm - default = 0.025
